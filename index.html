<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sixteen Grams Corporation</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body
        class="h-screen overflow-hidden flex items-center justify-center bg-[#fafaf7] text-[#1a1a1a]"
    >
        <main class="@container w-full max-w-[28rem] p-6 text-left">
            <div
                class="font-bold tracking-tight leading-none mb-6"
                style="font-size: 60cqw"
            >
                16g
            </div>
            <h1 class="mb-5">
                <svg
                    viewBox="0 0 100 8"
                    preserveAspectRatio="xMidYMid meet"
                    class="w-full block"
                >
                    <text
                        x="0"
                        y="7"
                        textLength="100"
                        lengthAdjust="spacingAndGlyphs"
                        font-size="8"
                        font-weight="600"
                        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                        style="font-variant-caps: small-caps"
                        fill="currentColor"
                    >
                        Sixteen Grams Corporation
                    </text>
                </svg>
            </h1>
            <p class="mb-5 leading-relaxed">
                <a href="mailto:hello@16g.ca" class="underline">hello@16g.ca</a>
            </p>
            <p class="mb-4 leading-relaxed">
                We are an Ontario-based corporation behind a handful of
                projects, including:
            </p>
            <ul class="space-y-2 leading-relaxed">
                <li>
                    <strong class="font-semibold">Dial</strong>, a public coffee
                    brew repository for iOS.
                </li>
                <li>
                    <strong class="font-semibold"
                        >The Earth to Clemi Field Guide</strong
                    >, a seasonal companion for the journey home to yourself.
                </li>
            </ul>
        </main>
    </body>
</html>
